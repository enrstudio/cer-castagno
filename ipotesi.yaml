  # gli scenari senza gas.

  costo_nuovo_gpl:
    valore: null
    min: null
    max: null
    unita: EUR per casa
    descrizione: "Scenario di confronto: restare col GPL, con serbatoio nuovo o adeguato (quota per casa) ed eventuale caldaia nuova."
    fonte: Preventivo Beyfin e termotecnico
    stato: da_verificare

  costo_dismissione_bombolone:
    valore: null
    min: null
    max: null
