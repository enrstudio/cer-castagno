    descrizione: Energia contenuta in un kg di pellet certificato.
    fonte: Norma ISO 17225-2, classe A1 (almeno 4,6 kWh/kg)
    stato: da_verificare

  rendimento_stufa_pellet:
    valore: 0.88
    min: 0.85
    max: 0.92
    unita: adimensionale
    descrizione: Quota dell'energia del pellet che diventa calore in casa.
    fonte: Schede tecniche delle stufe in commercio
    stato: da_verificare

  prezzo_pellet:
    valore: 0.42
    min: 0.33
    max: 0.50
    unita: EUR/kg
    descrizione: Prezzo del pellet in sacchi da 15 kg (circa 6,30 € al sacco).
    fonte: Prezzi al dettaglio in Toscana; da aggiornare con i rivenditori locali
    stato: da_verificare

  pci_legna:
    valore: 4.0
    min: 3.5
    max: 4.3
    unita: kWh/kg
    descrizione: Energia contenuta in un kg di legna ben stagionata (umidità intorno al 20%).
    fonte: Letteratura tecnica (AIEL)
    stato: da_verificare

  rendimento_stufa_legna:
    valore: 0.75
    min: 0.60
    max: 0.85
    unita: adimensionale
    descrizione: Quota dell'energia della legna che diventa calore in casa. Un camino aperto rende molto meno (20-30%).
    fonte: Schede tecniche delle stufe in commercio
    stato: da_verificare

  prezzo_legna:
    valore: 0.18
    min: 0.10
    max: 0.25
    unita: EUR/kg
    descrizione: Prezzo della legna stagionata consegnata (18 € al quintale). Zero se è legna propria, ma il lavoro ha un costo.
    fonte: Prezzi locali da verificare
    stato: da_verificare

  costo_stufa_pellet:
    valore: 3000
    min: 2000
    max: 4500
    unita: EUR
    descrizione: Stufa a pellet installata, con canna fumaria.
    fonte: Preventivi
    stato: da_verificare

  costo_stufa_legna:
    valore: 2500
    min: 1500
    max: 4000
    unita: EUR
    descrizione: Stufa a legna installata, con canna fumaria.
    fonte: Preventivi
    stato: da_verificare

  # --- Contatore elettrico -----------------------------------------------------

  potenza_dopo_elettrificazione:
