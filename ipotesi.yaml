# Registro delle ipotesi del progetto CER Castagno.
#
# È l'UNICA fonte dei parametri usati dal motore di calcolo: nessun numero
# va scritto direttamente nel codice. Ogni voce dichiara da dove viene e
# quanto ci si può fidare, così in assemblea si discute di questa tabella
# e non dei risultati.
#
# Campi di ogni voce:
#   valore       il valore usato nello scenario di base (null = ancora ignoto)
#   min, max     la forchetta plausibile, usata per le analisi di sensibilità
#   unita        unità di misura (EUR = euro; IVA inclusa se non detto altrimenti)
#   descrizione  cosa rappresenta, in parole semplici
#   fonte        da dove viene il valore
#   stato        dalle_bollette | verificato | da_verificare | decide_il_gruppo | da_calcolare
#
# Le voci "da_verificare" vengono da una prima stesura e vanno controllate
# sulle fonti ufficiali prima di usarle per decidere.

versione: 0.3.0
aggiornato: 2026-10-26

ipotesi:

  # --- Prezzi dell'energia ---------------------------------------------------

  prezzo_luce_marginale:
    valore: 0.335
    min: 0.28
    max: 0.38
    unita: EUR/kWh
    descrizione: Costo di un kWh in più prelevato dalla rete, con oneri, accise e IVA.
    fonte: "Bollette Enel 2025-26 di Seccheto: quota consumi 0,282 + accisa 0,0227, IVA 10%"
    stato: dalle_bollette

  quota_potenza:
    valore: 1.91
    min: null
    max: null
    unita: EUR/kW/mese
    descrizione: Costo fisso per ogni kW di potenza impegnata del contatore, IVA esclusa.
    fonte: Bolletta Enel di agosto 2026
    stato: dalle_bollette

  prezzo_gpl:
    valore: 6.40
    min: 6.33
    max: 6.46
    unita: EUR/m3
    descrizione: Costo medio di un metro cubo di GPL al contatore, tutto compreso.
    fonte: Fatture Beyfin 2023-2025, media delle tre annate
    stato: dalle_bollette

  prezzo_ritiro_dedicato:
    valore: 0.09
    min: 0.06
    max: 0.12
    unita: EUR/kWh
    descrizione: Prezzo a cui il GSE compra l'energia immessa in rete.
    fonte: Prezzi zonali GSE, zona Centro-Nord
    stato: da_verificare

  # --- Calore ----------------------------------------------------------------

  pci_gpl:
    valore: 24.0
    min: 23.0
    max: 25.5
    unita: kWh/m3
    descrizione: Energia contenuta in un metro cubo di GPL gassoso (potere calorifico inferiore).
    fonte: Letteratura tecnica; chiedere il valore a Beyfin
    stato: da_verificare

  rendimento_caldaia_gpl:
    valore: 0.90
    min: 0.85
    max: 0.95
    unita: adimensionale
    descrizione: Quota dell'energia del GPL che diventa calore utile in casa.
    fonte: Targa della caldaia
    stato: da_verificare

  scop_pdc:
    valore: 3.0
    min: 2.5
    max: 3.5
    unita: adimensionale
    descrizione: kWh di calore prodotti in media in un anno da una pompa di calore per ogni kWh elettrico. Solo per controllo; il motore calcola il COP ora per ora.
    fonte: Scheda tecnica e clima locale; motore/calore.py
    stato: da_calcolare

  acs_kwh_persona_giorno:
    valore: 0.8
    min: 0.5
    max: 1.6
    unita: kWh/persona/giorno
    descrizione: Calore per l'acqua calda di una persona in un giorno (circa 25 litri scaldati da 15 a 40 °C, più le perdite).
    fonte: "UNI/TS 11300-2: circa 4 kWh/giorno per un alloggio di 100 m². Con 1,6 per persona le letture GPL della casa al centro (5 persone) non tornano: scarto quasi doppio e temperatura base di 10 °C"
    stato: da_verificare

  gpl_cucina_m3_giorno:
    valore: 0.06
    min: 0.03
    max: 0.10
    unita: m3/giorno per casa
    descrizione: GPL usato per cucinare (circa 22 m³ all'anno).
    fonte: Ordine di grandezza per una famiglia; dal questionario e dalle bollette estive
    stato: da_verificare

  temperatura_base_riscaldamento:
    valore: 15
    min: 10
    max: 20
    unita: °C
    descrizione: Temperatura media esterna del giorno sopra la quale il riscaldamento resta spento. Con le letture del contatore il motore cerca il valore che le spiega meglio, dentro la forchetta; senza letture usa il valore di base.
    fonte: Calibrazione sulle letture effettive del contatore GPL
    stato: da_calcolare

  temperatura_interna:
    valore: 20
    min: 18
    max: 21
    unita: °C
    descrizione: Temperatura della casa riscaldata. Serve solo a distribuire il calore del giorno fra le ore.
    fonte: Valore di legge per le abitazioni (DPR 74/2013)
    stato: verificato

  mandata_a_zero_gradi:
    valore: 40
    min: 35
    max: 50
    unita: °C
    descrizione: Temperatura dell'acqua mandata ai termosifoni quando fuori ci sono 0 °C. Termosifoni piccoli o in una casa poco isolata chiedono acqua più calda; il pavimento radiante circa 30 °C.
    fonte: Curva climatica tipica per termosifoni (Ruhnau e altri 2019, When2Heat); da controllare col termotecnico
    stato: da_verificare

  pendenza_curva_climatica:
    valore: 1.0
    min: 0.5
    max: 1.5
    unita: °C/°C
    descrizione: Di quanti gradi sale l'acqua dei termosifoni per ogni grado in meno fuori (pavimento radiante circa 0,5).
    fonte: Ruhnau e altri 2019, When2Heat
    stato: da_verificare

  temperatura_acqua_calda:
    valore: 50
    min: 45
    max: 55
    unita: °C
    descrizione: Temperatura a cui la pompa di calore scalda l'acqua per bagno e cucina.
    fonte: Ruhnau e altri 2019, When2Heat
    stato: da_verificare

  correzione_cop:
    valore: 0.85
    min: 0.75
    max: 0.95
    unita: adimensionale
    descrizione: Quanto rende una pompa di calore installata rispetto alle schede tecniche (sbrinamenti, accensioni e spegnimenti).
    fonte: Ruhnau e altri 2019, When2Heat
    stato: da_verificare

  rendimento_fornelli_gas:
    valore: 0.40
    min: 0.30
    max: 0.55
    unita: adimensionale
    descrizione: Quota del calore della fiamma che arriva nella pentola.
    fonte: Letteratura tecnica sui piani cottura
    stato: da_verificare

  rendimento_induzione:
    valore: 0.85
    min: 0.80
    max: 0.90
    unita: adimensionale
    descrizione: Quota dell'elettricità di un piano a induzione che arriva nella pentola.
    fonte: Letteratura tecnica sui piani cottura
    stato: da_verificare

  # --- Stufe a pellet e a legna ------------------------------------------------

  quota_stufa:
    valore: 0.5
    min: 0.0
    max: 0.9
    unita: frazione
    descrizione: Quota del riscaldamento degli ambienti coperta dalla stufa negli scenari ibridi. Il resto e l'acqua calda li fa la pompa di calore.
