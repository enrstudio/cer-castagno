  costo_pdc:
    valore: 11000
    min: 8000
    max: 14000
    unita: EUR
    descrizione: Pompa di calore aria-acqua installata per una casa.
    fonte: Preventivi
    stato: da_verificare

  # --- Uscita dal gas e alternativa GPL ------------------------------------------
