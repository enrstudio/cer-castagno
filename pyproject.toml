[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cer-castagno"
version = "0.1.0"
description = "Strumenti per valutare una comunità energetica a Castagno di Piteccio (Pistoia)"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
# 3.10 è il minimo per la sintassi dei tipi usata (X | None).
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["motore"]

[tool.pytest.ini_options]
testpaths = ["test"]
